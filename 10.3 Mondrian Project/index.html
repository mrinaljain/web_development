<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container{
      display: grid;
      width:748px;
      height: 748px;
      gap: 9px;
      grid-template-rows:414px 130px 155px 22px;
      grid-template-columns: 320px 198px 153px 50px;
      background-color: #000;
    }
    .white{
      background-color: #F0F1EC;
    }
    .white.whiteone{
     grid-column: span 3;
    }
    .white.whitetwo{
    
     grid-row-start: 2;
     grid-row-end: 4;
    }
    .white.whitethree{
     grid-column-start: 2;
     grid-column-end: 4;
     grid-row-start: 2;
     grid-row-end: 4;
    }
    .white.whitefour{
      grid-row: span 2;
    }
    .black{
      background-color: #232629;
      grid-column-start: 3;
      grid-column-end: 4;
    }
    .red{
      background-color: #E72F24;
    }
    .blue{
      background-color: #004592;
      border-bottom: solid 10px black;
    }
    .yellow{
      background-color: #F9D01E;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="container">
    <div class="box red "></div>
    <div class="box white whiteone"></div>
    <div class="box white whitetwo"></div> 
    <div class="box white whitethree"></div> 
    <div class="box blue "></div>
    <div class="box white whitefour"></div>
    <div class="box white"></div>
    <div class="box yellow"></div>
    <div class="box black"></div>
   
  </div>
</body>

</html>
