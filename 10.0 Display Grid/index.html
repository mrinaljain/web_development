<!DOCTYPE html>
<html>

<head>
  <title>Chessboard</title>
  <style>
    /* Write your code here */
    /* Each square should be 100px by 100px */
    /* My colours for white: #f0d9b5, black: #b58863 */
    html{
      box-sizing: border-box;
    }
    .white{
      background-color: #f0d9b5;
      /* width: 100px; */
      /* height: 200px;  */
      border: solid 1px black;
      
    }
   
    .container{
      display: grid;
      grid-template-rows: 200px 300px 400px;
      grid-template-columns: 250px 350px 450px;
      grid-auto-rows: 100px;
      
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="white">1</div>
    <div class="white">2</div>
    <div class="white">3</div>
    <div class="white">4</div>
    <div class="white">5</div>
    <div class="white">6</div>
    <div class="white">7</div>
    <div class="white">8</div>
    <div class="white">9</div>
    <div class="white">10</div>
    <div class="white">11</div>
  </div>

</html>
